<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unasked Question Engine</title>
<style>
  :root {
    --bg: #0a0a0f;
    --card: #14141c;
    --border: #25252f;
    --text: #e8e8ee;
    --muted: #8a8a9a;
    --accent: #6c8cff;
    --high: #ff5c6c;
    --mid: #ffb347;
    --low: #4cd9a0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(circle at top, #14142a 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    padding: 40px 16px;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 2rem; letter-spacing: -0.5px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 8px 0 28px; }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
  }
  textarea {
    width: 100%; min-height: 180px; resize: vertical;
    background: #0d0d14; color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; font-size: 0.95rem; font-family: inherit;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .row { display: flex; gap: 12px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  .file-btn {
    border: 1px dashed var(--border); color: var(--muted);
    padding: 10px 16px; border-radius: 10px; cursor: pointer; font-size: 0.9rem;
  }
  .file-btn:hover { border-color: var(--accent); color: var(--text); }
  .file-btn input { display: none; }
  #fileName { color: var(--muted); font-size: 0.85rem; }
  button#go {
    margin-left: auto;
    background: var(--accent); color: #0a0a0f; font-weight: 600;
    border: none; padding: 12px 26px; border-radius: 10px;
    cursor: pointer; font-size: 1rem;
  }
  button#go:hover { filter: brightness(1.1); }
  button#go:disabled { opacity: 0.5; cursor: not-allowed; }
  #status { margin-top: 24px; color: var(--muted); text-align: center; }
  .spinner {
    display: inline-block; width: 18px; height: 18px;
    border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Score + kill shot */
  .score-box {
    display: flex; align-items: center; gap: 20px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px; margin-top: 24px;
  }
  .score-num { font-size: 3rem; font-weight: 700; line-height: 1; }
  .score-num small { font-size: 1rem; color: var(--muted); }
  .score-txt { color: var(--muted); font-size: 0.92rem; line-height: 1.5; }
  .kill {
    background: rgba(255,92,108,0.08); border: 1px solid var(--high);
    border-radius: 14px; padding: 18px; margin-top: 14px;
  }
  .kill .tag {
    color: var(--high); font-weight: 700; font-size: 0.75rem;
    letter-spacing: 1px; text-transform: uppercase;
  }
  .kill .q { margin-top: 6px; font-weight: 600; font-size: 1.05rem; }

  /* Cards */
  #results { margin-top: 24px; display: grid; gap: 14px; }
  .item {
    background: var(--card); border: 1px solid var(--border);
    border-left: 4px solid var(--low);
    border-radius: 12px; padding: 18px;
  }
  .item.high { border-left-color: var(--high); }
  .item.mid { border-left-color: var(--mid); }
  .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .q { font-weight: 600; font-size: 1.05rem; line-height: 1.4; }
  .badge {
    flex-shrink: 0; font-size: 0.75rem; font-weight: 700;
    padding: 4px 10px; border-radius: 20px;
    background: rgba(76,217,160,0.15); color: var(--low);
  }
  .high .badge { background: rgba(255,92,108,0.15); color: var(--high); }
  .mid .badge { background: rgba(255,179,71,0.15); color: var(--mid); }
  .cat {
    color: var(--accent); font-size: 0.78rem; text-transform: uppercase;
    letter-spacing: 1px; margin: 6px 0 10px;
  }
  .persona {
    display: inline-block; font-size: 0.75rem; padding: 3px 10px;
    border-radius: 20px; background: rgba(108,140,255,0.15);
    color: var(--accent); margin-right: 8px;
  }
  .label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; margin-top: 12px; }
  .ev {
    margin-top: 4px; padding: 10px 12px; background: #0d0d14;
    border-radius: 8px; font-style: italic; color: #c9c9d6; font-size: 0.9rem;
  }
  .txt { margin-top: 4px; font-size: 0.92rem; line-height: 1.5; }
  .err { color: var(--high); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Unasked <span>Question</span> Engine</h1>
  <p class="sub">Paste a project document or upload a PDF. Find what you forgot to ask.</p>

  <div class="panel">
    <textarea id="text" placeholder="Paste your project proposal, plan, or workflow here..."></textarea>
    <div class="row">
      <label class="file-btn">
        Upload PDF
        <input type="file" id="file" accept="application/pdf">
      </label>
      <span id="fileName"></span>
      <button id="go">Analyze</button>
    </div>
  </div>

  <div id="status"></div>
  <div id="summary"></div>
  <div id="results"></div>
</div>

<script>
  const API = "/analyze";
  const textEl = document.getElementById("text");
  const fileEl = document.getElementById("file");
  const fileName = document.getElementById("fileName");
  const goBtn = document.getElementById("go");
  const statusEl = document.getElementById("status");
  const summaryEl = document.getElementById("summary");
  const resultsEl = document.getElementById("results");

  fileEl.addEventListener("change", () => {
    fileName.textContent = fileEl.files[0] ? fileEl.files[0].name : "";
  });

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function render(data) {
    const items = data.results || [];
    items.forEach(it => {
      it.priority = Number(it.priority) || (Number(it.impact) || 0) * (Number(it.likelihood) || 0);
    });
    items.sort((a, b) => b.priority - a.priority);

    summaryEl.innerHTML = "";
    resultsEl.innerHTML = "";

    // Readiness score
    const score = Number(data.score) || 0;
    const color = score >= 70 ? "var(--low)" : score >= 40 ? "var(--mid)" : "var(--high)";
    const box = el("div", "score-box");
    const num = el("div", "score-num");
    num.style.color = color;
    num.textContent = score;
    num.appendChild(el("small", "", " / 100"));
    box.appendChild(num);
    box.appendChild(el("div", "score-txt",
      "Readiness Score. Higher means fewer blind spots. " + (data.score_reason || "")));
    summaryEl.appendChild(box);

    // Kill shot = top priority question
    if (items.length) {
      const k = items[0];
      const kill = el("div", "kill");
      kill.appendChild(el("div", "tag", "Kill shot question"));
      kill.appendChild(el("div", "q", k.question || ""));
      kill.appendChild(el("div", "txt", k.why_it_matters || ""));
      summaryEl.appendChild(kill);
    }

    // Cards
    items.forEach((it, i) => {
      const p = it.priority;
      const level = p >= 15 ? "high" : p >= 8 ? "mid" : "low";
      const card = el("div", "item " + level);

      const top = el("div", "top");
      top.appendChild(el("div", "q", (i + 1) + ". " + (it.question || "")));
      top.appendChild(el("div", "badge", "Priority " + p));
      card.appendChild(top);

      const meta = el("div", "cat");
      meta.appendChild(el("span", "persona", it.persona || "Reviewer"));
      meta.appendChild(document.createTextNode(it.category || "general"));
      card.appendChild(meta);

      if (it.evidence) {
        card.appendChild(el("div", "label", "Evidence"));
        card.appendChild(el("div", "ev", it.evidence));
      }
      if (it.why_it_matters) {
        card.appendChild(el("div", "label", "Why it matters"));
        card.appendChild(el("div", "txt", it.why_it_matters));
      }
      if (it.recommendation) {
        card.appendChild(el("div", "label", "Recommendation"));
        card.appendChild(el("div", "txt", it.recommendation));
      }
      resultsEl.appendChild(card);
    });
  }

  goBtn.addEventListener("click", async () => {
    const text = textEl.value.trim();
    const file = fileEl.files[0];
    if (!text && !file) {
      statusEl.innerHTML = '<span class="err">Paste some text or upload a PDF first.</span>';
      return;
    }

    const fd = new FormData();
    if (file) fd.append("file", file);
    else fd.append("text", text);

    goBtn.disabled = true;
    summaryEl.innerHTML = "";
    resultsEl.innerHTML = "";
    statusEl.innerHTML = '<span class="spinner"></span>Analyzing... this can take 20-40 seconds';

    try {
      const res = await fetch(API, { method: "POST", body: fd });
      if (!res.ok) throw new Error("Server error " + res.status);
      const data = await res.json();
      const items = data.results || [];
      statusEl.textContent = items.length + " unasked questions found";
      render(data);
    } catch (err) {
      statusEl.innerHTML = '<span class="err">Failed: ' + err.message + '</span>';
    } finally {
      goBtn.disabled = false;
    }
  });
</script>
</body>
</html>
